<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Hair Boutique by Moshe — קביעת תור</title>
<meta name="description" content="קביעת תור אונליין ל-Hair Boutique by Moshe, קריית אתא. תספורות, עיצוב זקן וטיפוח שיער — בחרו שירות, יום ושעה.">
<meta name="theme-color" content="#0C0A09">

<!-- Open Graph: how the link looks when shared on WhatsApp / Facebook -->
<meta property="og:title" content="Hair Boutique by Moshe — קביעת תור">
<meta property="og:description" content="קובעים תור אונליין, בכל שעה, ישירות מהנייד.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://go4tor.co.il/moshe">
<meta property="og:locale" content="he_IL">

<style>
  html,body{margin:0;padding:0;height:100%;background:#0C0A09;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  /* Loading state shown until the app inside the frame paints */
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:#0C0A09;z-index:2;
        transition:opacity .4s ease}
  #boot.gone{opacity:0;pointer-events:none}
  .bar{width:120px;height:4px;border-radius:3px;
       background:repeating-linear-gradient(115deg,#C9A24B 0 10px,#8A3A34 10px 20px,#F3ECDD 20px 30px);
       animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
  <div id="boot"><div class="bar"></div></div>

  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbz5eJa0XR2NqRLcNjg7_Zeo87HlZKu84SwlWzFYO8haobh4AJ2B2Oa1ZJjkvUQAYJyM/exec?tenant=moshe"
    allow="clipboard-write; geolocation"
    referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
  // Hide the loader once the embedded app has loaded, with a fallback
  // in case the load event is missed.
  var boot = document.getElementById('boot');
  var app  = document.getElementById('app');
  function done(){ boot.classList.add('gone'); }
  app.addEventListener('load', function(){ setTimeout(done, 400); });
  setTimeout(done, 6000);
</script>
</body>
</html>
